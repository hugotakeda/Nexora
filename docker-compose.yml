# ============================================================
# NEXORA — banco MySQL 8 em Docker
#
#   docker compose up -d        sobe o MySQL (e cria as 11 tabelas na 1ª vez)
#   docker compose down         desliga, mantendo os dados
#   docker compose down -v      desliga e APAGA os dados (próxima subida recria tudo)
#
# O arquivo banco/schema.sql é montado em /docker-entrypoint-initdb.d, então o
# próprio container cria o banco, as tabelas, o usuário "nexora" e os dados de
# demonstração na primeira vez que sobe. Não precisa rodar nada à mão.
#
# Adminer (http://localhost:8080) é um visualizador web do banco, útil na
# defesa para mostrar as tabelas. Servidor: mysql · usuário: nexora · senha: nexora
# ============================================================
services:
  mysql:
    image: mysql:8.0
    container_name: nexora-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nexora
      MYSQL_USER: nexora
      MYSQL_PASSWORD: nexora
      TZ: America/Sao_Paulo
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - nexora-dados:/var/lib/mysql
      - ./banco/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  adminer:
    image: adminer:latest
    container_name: nexora-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  nexora-dados:
